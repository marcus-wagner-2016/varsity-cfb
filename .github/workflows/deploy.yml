name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react

      - name: Build (served from /varsity-cfb/ on GitHub Pages)
        run: npm run build -- --base=/varsity-cfb/
        working-directory: react

      # Pages is configured to serve the main branch directly, so the build
      # output lives at the repo root. Refresh it whenever the source changes.
      # "[skip ci]" stops this push from re-triggering the workflow.
      - name: Publish build to repo root
        run: |
          rm -rf assets
          cp -R react/dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish site build [skip ci]"
            git push
          fi

      # Also deploy as a Pages artifact so the site keeps working if the
      # Pages source setting is ever switched to "GitHub Actions".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
